<DOCTYPE html>
  <html>
    <head>
      <title>Rock-Paper-Scissor-Game</title>
      <link rel="stylesheet" href="style.css">
    </head>
    <body>
      <p class="title">Rock Paper Scissors</p>

      <button class="js-rock-button css-moves-button">
        <img src="images/rock-emoji.png"class="css-moves">
      </button>

      <button class="js-paper-button css-moves-button">
        <img src="images/paper-emoji.png"class="css-moves">
      </button>

      <button class="js-scissors-button css-moves-button">
        <img src="images/scissors-emoji.png"class="css-moves">
      </button>

      <p class = 'js-result css-result'></p>
      <p class = 'js-moves'></p>
      <p class = 'js-scores css-scores'></p>
      
      <button class = "js-reset-button css-reset">
      Reset</button>

      <button class="js-autoplay-button css-autoPlay">AutoPlay</button>
      <script src="script.js"></script>
    </body>
  </html>
