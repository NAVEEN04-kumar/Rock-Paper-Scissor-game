<DOCTYPE html>
  <html>
    <head>
      <title>Rock-Paper-Scissor-Game</title>
      <link rel="stylesheet" href="style.css">
    </head>
    <body>
      <p class="title">Rock Paper Scissors</p>

      <button onclick="
        playGame('Rock');
      "class="cs-moves-button">
        <img src="images/rock-emoji.png"class="cs-moves">
      </button>

      <button onclick="
        playGame('Paper');
      "class="cs-moves-button">
        <img src="images/paper-emoji.png"class="cs-moves">
      </button>

      <button onclick="
        playGame('Scissors');
      "class="cs-moves-button">
        <img src="images/scissors-emoji.png"class="cs-moves">
      </button>

      <p class = 'js-result cs-result'></p>
      <p class = 'js-moves'></p>
      <p class = 'js-scores cs-scores'></p>
      
      <button onclick=" 
        playGame('Reset');
      " class = "js-reset-Button css-reset">
      Reset</button>

      <button onclick="
        autoPlay();
      " class="css-autoPlay">AutoPlay</button>
      <script src="script.js"></script>
    </body>
  </html>
